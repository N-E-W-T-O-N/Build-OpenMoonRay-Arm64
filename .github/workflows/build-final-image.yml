name: Build & Push moonray:ubuntu-final

# Merges the CI-built deps image (deps-heavy, all non-USD deps) with the
# locally-built USD carrier (moonray:usd) into the complete build image
# moonray:ubuntu-final. Native arm64 runner — no QEMU.
#
# Prereqs (must already be on Docker Hub):
#   - <user>/moonray:deps-heavy-ubuntu26.04   (from build-ubuntu26-deps-image.yml)
#   - <user>/moonray:usd                      (built + pushed locally, see usd.Dockerfile)
#
# Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  workflow_dispatch:
  # ubuntu (deps-heavy) image was rebuilt -> rebuild final
  workflow_run:
    workflows: ["Build & Push deps-heavy Ubuntu 26.04 image"]
    types: [completed]
  # usd carrier was pushed locally -> fire this from the host with:
  #   gh api repos/N-E-W-T-O-N/Build-OpenMoonRay-Arm64/dispatches -f event_type=usd-updated
  repository_dispatch:
    types: [usd-updated]
  # final.Dockerfile itself changed
  push:
    branches: ["26"]
    paths:
      - final.Dockerfile
      - .github/workflows/build-final-image.yml

env:
  IMAGE_NAME: moonray
  TAG: ubuntu-final

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native arm64
    # skip if the upstream deps build failed (workflow_run fires on any conclusion)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push final image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: final.Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            DEPS_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/moonray:deps-heavy-ubuntu26.04
            USD_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/moonray:usd
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
