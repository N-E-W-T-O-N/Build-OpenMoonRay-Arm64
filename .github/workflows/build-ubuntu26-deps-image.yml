name: Build & Push deps-heavy Ubuntu 26.04 image

# Builds the heavy deps image (apt + tools + oneTBB + OIDN + USD) on GitHub's
# NATIVE arm64 runner — no QEMU, so the USD build runs at full speed (~1-2 h).
# Can also be built locally: docker build -f ubuntu.Dockerfile -t newton2022/moonray:deps-heavy-ubuntu26.04 .
#
# Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  workflow_dispatch:
  push:
    branches: ["26"]
    paths:
      - ubuntu.Dockerfile
      - .github/workflows/build-ubuntu26-deps-image.yml

env:
  IMAGE_NAME: moonray
  TAG: deps-heavy-ubuntu26.04

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native arm64 — no QEMU emulation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ubuntu.Dockerfile
          target: heavy
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache-ubuntu26
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache-ubuntu26,mode=max
